<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>YEAT · Réalité augmentée</title>
  <meta name="theme-color" content="#0a0a12" />

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-v1.5.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      --bleu: #1b5cff;
      --jaune: #ffe500;
      --noir: #07070c;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: var(--noir); }
    body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: "Helvetica Neue", Arial, sans-serif; color: #fff; }
    .a-enter-vr, .a-enter-ar, .a-fullscreen-button, .mindar-ui-overlay { display: none !important; }
    a-scene { position: fixed; inset: 0; }

    /* ---------- Accueil ---------- */
    #home {
      position: fixed; inset: 0; z-index: 30; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 28px; overflow: hidden;
      transition: opacity .45s ease, visibility .45s;
    }
    #home.gone { opacity: 0; visibility: hidden; }
    #home-bg {
      position: absolute; inset: -12%; background-size: cover; background-position: center;
      filter: blur(22px) saturate(1.6) brightness(.85); transform: scale(1.1);
    }
    #home-grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .45; mix-blend-mode: overlay; }
    #home-veil {
      position: absolute; inset: 0;
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(27,92,255,.45), transparent 60%),
        radial-gradient(90% 60% at 50% 100%, rgba(255,229,0,.28), transparent 60%),
        linear-gradient(180deg, rgba(7,7,12,.35), rgba(7,7,12,.78));
    }
    #home .contenu {
      position: relative; z-index: 2; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }

    .kicker { font-size: 12px; letter-spacing: .55em; color: #cfd6ff; text-transform: uppercase; margin-bottom: 14px; }
    #title {
      font-size: clamp(64px, 22vw, 150px); font-weight: 900; line-height: .82;
      letter-spacing: -.02em; margin: 0;
      color: var(--jaune);
      text-shadow:
        3px 3px 0 var(--bleu), -3px -3px 0 var(--bleu),
        3px -3px 0 var(--bleu), -3px 3px 0 var(--bleu),
        0 0 42px rgba(27,92,255,.85);
      animation: wobble 5s ease-in-out infinite;
    }
    @keyframes wobble {
      0%, 100% { transform: skewX(-3deg) scaleY(1); }
      50% { transform: skewX(3deg) scaleY(1.04); }
    }
    .sous { margin: 16px 0 0; font-size: 15px; line-height: 1.55; color: #e8ebff; max-width: 21em; }
    .sous b { color: var(--jaune); font-weight: 700; }

    #go {
      margin-top: 42px; width: 170px; height: 170px; border-radius: 50%;
      border: 3px solid var(--bleu); background: var(--jaune); color: #06060c;
      font-size: 17px; font-weight: 900; letter-spacing: .12em; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px;
      box-shadow: 0 0 0 0 rgba(255,229,0,.55), 0 14px 50px rgba(27,92,255,.5);
      animation: pulse 2.4s ease-out infinite;
    }
    #go span.petit { font-size: 11px; font-weight: 700; letter-spacing: .2em; opacity: .65; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255,229,0,.5), 0 14px 50px rgba(27,92,255,.5); }
      70% { box-shadow: 0 0 0 34px rgba(255,229,0,0), 0 14px 50px rgba(27,92,255,.5); }
      100% { box-shadow: 0 0 0 0 rgba(255,229,0,0), 0 14px 50px rgba(27,92,255,.5); }
    }
    #go.charge { animation: rotation 1.1s linear infinite; background: #fff; }
    @keyframes rotation { to { transform: rotate(360deg); } }
    .note { margin-top: 26px; font-size: 12px; color: #9aa3c7; letter-spacing: .04em; }

    /* ---------- Interface RA ---------- */
    .btn {
      position: fixed; top: max(14px, env(safe-area-inset-top)); z-index: 25;
      height: 44px; padding: 0 16px; border: 1px solid rgba(255,255,255,.25); border-radius: 999px;
      background: rgba(8,8,16,.6); backdrop-filter: blur(8px); color: #fff;
      font-size: 14px; font-weight: 700; letter-spacing: .04em; cursor: pointer; display: none;
      align-items: center; gap: 8px;
    }
    .btn.on { display: flex; }
    #mute { right: 14px; }
    #back { left: 14px; }

    #hint {
      position: fixed; left: 50%; bottom: max(26px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      z-index: 25; display: none; align-items: center; gap: 10px;
      padding: 12px 20px; border-radius: 999px; font-size: 14px; letter-spacing: .03em;
      background: rgba(8,8,16,.62); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.18);
      transition: opacity .35s; white-space: nowrap;
    }
    #hint.on { display: flex; }
    #hint.cache { opacity: 0; }
    #hint .point { width: 9px; height: 9px; border-radius: 50%; background: var(--jaune); animation: clignote 1.1s infinite; }
    @keyframes clignote { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }

    /* ---------- Écran d'erreur ---------- */
    #erreur {
      position: fixed; inset: 0; z-index: 40; display: none;
      flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: var(--noir); padding: 30px; text-align: center; line-height: 1.6;
    }
    #erreur.on { display: flex; }
    #erreur h2 { color: var(--jaune); margin: 0; }
  </style>
</head>
<body>

  <!-- ===== Accueil ===== -->
  <div id="home">
    <div id="home-bg"></div>
    <canvas id="home-grain"></canvas>
    <div id="home-veil"></div>

    <div class="contenu">
    <p class="kicker">Réalité augmentée</p>
    <h1 id="title">YEAT</h1>
    <p class="sous">Vise l'affiche avec ta caméra : elle <b>prend vie</b>, en musique.</p>

    <button id="go">
      LANCER
      <span class="petit">CAMÉRA + SON</span>
    </button>

    <p class="note">Autorise la caméra quand ton téléphone la demande</p>
    </div>
  </div>

  <!-- ===== Interface pendant la RA ===== -->
  <button id="back" class="btn">← Retour</button>
  <button id="mute" class="btn">🔊 Son</button>
  <div id="hint"><span class="point"></span> Vise l'affiche</div>

  <div id="erreur">
    <h2>Caméra indisponible</h2>
    <p id="erreur-msg"></p>
  </div>

  <audio id="track" loop preload="auto" playsinline></audio>

  <script>
    // ==================== RÉGLAGES ====================
    const VOLUME = 0.85;        // volume de la musique (0 à 1)
    const PARTICULES = 420;     // nombre de particules (baisse si ça rame sur un vieux téléphone)
    const BLEU = 0x1b5cff, JAUNE = 0xffe500, BLANC = 0xffffff;

    // Fichiers à côté de cette page (chargés en arrière-plan)
    const MIND_URL   = "target.mind";      // cible de reconnaissance (l'affiche)
    const AUDIO_URL  = "musique.mp3";      // musique
    const POSTER_URL = "affiche.jpg";      // miniature de l'affiche (fond de l'accueil)
    const LOGO_URL   = "logo.webp";        // logo YEAT en relief
    // ==================================================

    const $ = (id) => document.getElementById(id);

    $('home-bg').style.backgroundImage = `url("${POSTER_URL}")`;
    $('track').src = AUDIO_URL;
    $('track').volume = VOLUME;

    // La cible se télécharge pendant que la personne lit l'accueil :
    // quand elle appuie sur LANCER, le fichier est déjà en cache.
    let ciblePrete = fetch(MIND_URL, { cache: 'force-cache' }).then(r => r.ok).catch(() => false);

    const erreur = (msg) => { $('erreur-msg').innerHTML = msg; $('erreur').classList.add('on'); };

    // ---------- Grain animé de l'accueil ----------
    (function grain() {
      const c = $('home-grain'), x = c.getContext('2d');
      const draw = () => {
        const w = c.width = Math.ceil(window.innerWidth / 3), h = c.height = Math.ceil(window.innerHeight / 3);
        const d = x.createImageData(w, h);
        for (let i = 0; i < d.data.length; i += 4) {
          const v = 120 + Math.random() * 135;
          d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 26;
        }
        x.putImageData(d, 0, 0);
      };
      draw();
      setInterval(() => { if (!$('home').classList.contains('gone')) draw(); }, 110);
      window.addEventListener('resize', draw);
    })();

    // ================= TEXTURES GÉNÉRÉES =================
    function texPoint() {
      const c = document.createElement('canvas'); c.width = c.height = 128;
      const x = c.getContext('2d');
      const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
      g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.3, 'rgba(255,255,255,.5)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = g; x.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    }
    function texEtoile() {   // étoile à 4 branches, comme sur l'affiche
      const c = document.createElement('canvas'); c.width = c.height = 128;
      const x = c.getContext('2d');
      x.fillStyle = '#fff';
      x.beginPath();
      for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2;
        x.moveTo(64, 64);
        x.quadraticCurveTo(64 + Math.cos(a - .35) * 22, 64 + Math.sin(a - .35) * 22, 64 + Math.cos(a) * 62, 64 + Math.sin(a) * 62);
        x.quadraticCurveTo(64 + Math.cos(a + .35) * 22, 64 + Math.sin(a + .35) * 22, 64, 64);
      }
      x.fill();
      const g = x.createRadialGradient(64, 64, 0, 64, 64, 26);
      g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = g; x.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    }
    function texHalftone(couleur, pas, rayon) {   // trame de points, comme l'impression de l'affiche
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const x = c.getContext('2d');
      x.fillStyle = couleur;
      for (let j = 0; j * pas < 256 + pas; j++) {
        for (let i = 0; i * pas < 256 + pas; i++) {
          const ox = (j % 2) * pas / 2;
          x.beginPath(); x.arc(i * pas + ox, j * pas, rayon, 0, Math.PI * 2); x.fill();
        }
      }
      const t = new THREE.CanvasTexture(c);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      return t;
    }

    // ================= EFFETS SUR L'AFFICHE =================
    AFRAME.registerComponent('yeat-fx', {
      init() {
        const root = this.el.object3D;
        this.clock = 0; this.t = 0; this.visible = false;
        const W = 1, H = 1.414;   // l'affiche : largeur 1, hauteur = format A

        const pointTex = texPoint(), etoileTex = texEtoile();
        const add = { transparent: true, depthWrite: false, blending: THREE.AdditiveBlending };

        // --- Calques de trame qui se décollent de l'affiche (parallaxe) ---
        this.calques = [];
        [[BLEU, 12, 2.0, 0.05, .16], [JAUNE, 16, 1.7, 0.12, .13], [BLANC, 22, 1.2, 0.2, .08]].forEach(([col, pas, r, z, op]) => {
          const tex = texHalftone('#fff', pas, r);
          tex.repeat.set(4, 5.6);
          const m = new THREE.Mesh(new THREE.PlaneGeometry(W * 1.02, H * 1.02),
            new THREE.MeshBasicMaterial({ map: tex, color: col, opacity: op, ...add }));
          m.position.z = z; m.userData = { z, op };
          root.add(m); this.calques.push(m);
        });

        // --- Balayage lumineux qui remonte l'affiche ---
        this.sweep = new THREE.Mesh(new THREE.PlaneGeometry(W * 1.05, 0.16),
          new THREE.MeshBasicMaterial({ map: pointTex, color: JAUNE, opacity: .3, ...add }));
        this.sweep.position.z = 0.04;
        root.add(this.sweep);

        // --- Particules ---
        const N = PARTICULES;
        const pos = new Float32Array(N * 3), col = new Float32Array(N * 3), taille = new Float32Array(N);
        this.pData = [];
        const c1 = new THREE.Color(BLEU), c2 = new THREE.Color(JAUNE), c3 = new THREE.Color(BLANC);
        for (let i = 0; i < N; i++) {
          const c = [c1, c2, c3][Math.floor(Math.random() * 3)];
          col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
          const d = { x: (Math.random() - .5) * W * 2.1, y: (Math.random() - .5) * H * 1.25, z: Math.random() * .75,
                      v: .06 + Math.random() * .3, ph: Math.random() * 6.28, r: .5 + Math.random() };
          this.pData.push(d);
          pos[i * 3] = d.x; pos[i * 3 + 1] = d.y; pos[i * 3 + 2] = d.z;
          taille[i] = d.r;
        }
        const pGeo = new THREE.BufferGeometry();
        pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        pGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
        this.pTaille = taille;
        this.particules = new THREE.Points(pGeo, new THREE.PointsMaterial({
          map: pointTex, size: .022, vertexColors: true, opacity: .85, sizeAttenuation: true, ...add
        }));
        root.add(this.particules);

        // --- Étoiles scintillantes ---
        this.etoiles = [];
        for (let i = 0; i < 14; i++) {
          const s = new THREE.Sprite(new THREE.SpriteMaterial({
            map: etoileTex, color: i % 2 ? JAUNE : BLANC, opacity: .9, ...add
          }));
          const t = .04 + Math.random() * .045;
          s.scale.set(t, t, 1);
          s.position.set((Math.random() - .5) * W * 1.9, (Math.random() - .5) * H * 1.15, .1 + Math.random() * .55);
          s.userData = { ph: Math.random() * 6.28, base: t };
          root.add(s); this.etoiles.push(s);
        }

        // --- Anneaux en orbite ---
        this.anneaux = [];
        [[.52, BLEU, .9], [.64, JAUNE, -.7], [.78, BLANC, .5]].forEach(([r, c, v], i) => {
          const m = new THREE.Mesh(new THREE.TorusGeometry(r, .0035, 8, 128),
            new THREE.MeshBasicMaterial({ color: c, opacity: .75, ...add }));
          m.rotation.set(Math.PI / 2.1 + i * .22, i * .5, 0);
          m.position.z = .3;
          m.userData = { v, r };
          root.add(m); this.anneaux.push(m);
        });

        // --- Globes en fil de fer (clin d'œil aux globes de l'affiche) ---
        this.globes = [];
        [[-.6, .8, .3, .12, BLEU], [.58, -.84, .26, .09, JAUNE]].forEach(([x, y, z, r, c]) => {
          const g = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12),
            new THREE.MeshBasicMaterial({ color: c, wireframe: true, opacity: .55, transparent: true, depthWrite: false }));
          g.position.set(x, y, z);
          root.add(g); this.globes.push(g);
        });

        // --- Logo YEAT en relief, qui flotte au-dessus ---
        this.logo = new THREE.Group();
        this.logo.position.set(0, H / 2 + .1, .45);
        root.add(this.logo);
        const logoTex = new THREE.TextureLoader().load(LOGO_URL);
        logoTex.colorSpace = THREE.SRGBColorSpace;
        const LW = .8, LH = LW * 435 / 1024;
        this.logoCouches = [];
        for (let i = 6; i >= 1; i--) {
          const m = new THREE.Mesh(new THREE.PlaneGeometry(LW, LH), new THREE.MeshBasicMaterial({
            map: logoTex, color: i > 3 ? BLEU : JAUNE, transparent: true, opacity: .75, depthWrite: false
          }));
          m.position.z = -.02 * i;
          this.logo.add(m); this.logoCouches.push(m);
        }
        this.logoFace = new THREE.Mesh(new THREE.PlaneGeometry(LW, LH), new THREE.MeshBasicMaterial({
          map: logoTex, color: JAUNE, transparent: true, depthWrite: false
        }));
        this.logo.add(this.logoFace);
        this.logoGlow = new THREE.Mesh(new THREE.PlaneGeometry(LW, LH), new THREE.MeshBasicMaterial({
          map: logoTex, color: BLANC, opacity: .25, ...add
        }));
        this.logoGlow.position.z = .01;
        this.logo.add(this.logoGlow);

        // --- Égaliseur audio en bas de l'affiche ---
        this.barres = [];
        const NB = 22;
        for (let i = 0; i < NB; i++) {
          const m = new THREE.Mesh(new THREE.PlaneGeometry(.014, 1),
            new THREE.MeshBasicMaterial({ color: i % 3 === 0 ? JAUNE : BLEU, opacity: .9, ...add }));
          m.position.set(-.42 + i * (.84 / (NB - 1)), -H / 2 + .03, .18);
          root.add(m); this.barres.push(m);
        }

        this.el.addEventListener('targetFound', () => { this.visible = true; this.t = 0; });
        this.el.addEventListener('targetLost', () => { this.visible = false; });
      },

      tick(time, dtMs) {
        const dt = Math.min(dtMs || 16, 100) / 1000;
        this.clock += dt;
        if (this.visible) this.t += dt;
        const now = this.clock;
        const intro = Math.min(this.t / 1.2, 1);
        const smooth = intro * intro * (3 - 2 * intro);

        // niveaux audio (graves / aigus / global)
        const a = window.__audioNiveaux || { grave: 0, medium: 0, aigu: 0, total: 0 };

        // calques de trame
        this.calques.forEach((m, i) => {
          const u = m.userData;
          m.position.z = u.z + (u.z * 1.6) * a.grave + .01 * Math.sin(now * .7 + i);
          m.material.opacity = u.op * smooth * (.7 + .6 * a.total);
          m.material.map.offset.x = now * (.01 + i * .008);
          m.material.map.offset.y = -now * (.02 + i * .01);
        });

        // balayage
        this.sweep.position.y = -0.707 + ((now * .45) % 1.55);
        this.sweep.material.opacity = .18 * smooth * (.5 + a.total);

        // particules
        const arr = this.particules.geometry.attributes.position.array;
        for (let i = 0; i < this.pData.length; i++) {
          const d = this.pData[i];
          d.y += d.v * dt * (.6 + 2.2 * a.grave);
          if (d.y > .95) { d.y = -.95; d.x = (Math.random() - .5) * 2.1; }
          arr[i * 3] = d.x + Math.sin(now * .8 + d.ph) * .05;
          arr[i * 3 + 1] = d.y;
          arr[i * 3 + 2] = d.z + Math.sin(now * .6 + d.ph) * .04;
        }
        this.particules.geometry.attributes.position.needsUpdate = true;
        this.particules.material.size = .02 + .022 * a.grave;
        this.particules.material.opacity = .75 * smooth;

        // étoiles
        this.etoiles.forEach((s, i) => {
          const k = .65 + .55 * Math.sin(now * 2.2 + s.userData.ph) + a.aigu * 1.3;
          const t = s.userData.base * Math.max(.25, k);
          s.scale.set(t, t, 1);
          s.material.opacity = smooth * Math.min(1, .35 + .65 * k);
          s.material.rotation = now * .35 + i;
        });

        // anneaux
        this.anneaux.forEach((m, i) => {
          m.rotation.z += dt * m.userData.v;
          m.rotation.x += dt * .15 * m.userData.v;
          const s = 1 + a.grave * .45 + .03 * Math.sin(now * 1.6 + i);
          m.scale.setScalar(s * smooth);
          m.material.opacity = (.35 + .6 * a.total) * smooth;
        });

        // globes
        this.globes.forEach((g, i) => {
          g.rotation.y += dt * (i ? -.5 : .35);
          g.rotation.x = .25 * Math.sin(now * .4 + i);
          g.scale.setScalar(smooth * (1 + a.medium * .25));
          g.material.opacity = .5 * smooth;
        });

        // logo
        this.logo.position.y = 1.414 / 2 + .1 + .035 * Math.sin(now * 1.3) - (1 - smooth) * .4;
        this.logo.rotation.y = .28 * Math.sin(now * .5);
        this.logo.rotation.x = -.05;
        this.logo.scale.setScalar(smooth * (1 + a.grave * .08));
        this.logoCouches.forEach((m, idx) => {
          const i = this.logoCouches.length - idx;
          m.position.z = -.02 * i * (.6 + .8 * smooth);
          m.material.opacity = .7 * smooth;
        });
        this.logoFace.material.opacity = smooth;
        this.logoGlow.material.opacity = smooth * (.12 + .5 * a.total);

        // égaliseur
        const spectre = window.__audioSpectre;
        this.barres.forEach((m, i) => {
          let v = .12;
          if (spectre) {
            const k = Math.floor(2 + i * 1.6);
            v = .02 + (spectre[k] / 255) * .24;
          } else {
            v = .03 + .02 * Math.sin(now * 3 + i);
          }
          m.scale.y = Math.max(.01, v) * smooth;
          m.position.y = -1.414 / 2 + .03 + (m.scale.y / 2);
          m.material.opacity = (.45 + .55 * Math.min(1, v)) * smooth;
        });
      }
    });

    // ================= SCÈNE =================
    document.body.insertAdjacentHTML('beforeend', `
      <a-scene
        mindar-image="imageTargetSrc: ${MIND_URL}; autoStart: false; uiScanning: no; uiLoading: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.004; missTolerance: 8; warmupTolerance: 1"
        renderer="colorManagement: true; antialias: true; alpha: true"
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity id="cible" mindar-image-target="targetIndex: 0" yeat-fx></a-entity>
      </a-scene>`);

    // ================= AUDIO =================
    const track = $('track');
    let analyser = null, spectre = null;
    function brancherAudio() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        const ctx = new Ctx();
        const src = ctx.createMediaElementSource(track);
        analyser = ctx.createAnalyser();
        analyser.fftSize = 128; analyser.smoothingTimeConstant = .75;
        src.connect(analyser); analyser.connect(ctx.destination);
        spectre = new Uint8Array(analyser.frequencyBinCount);
        window.__audioSpectre = spectre;
        ctx.resume();
      } catch (e) { console.warn('audio', e); }
    }
    function niveaux() {
      requestAnimationFrame(niveaux);
      if (!analyser || track.paused) { window.__audioNiveaux = { grave: 0, medium: 0, aigu: 0, total: 0 }; return; }
      analyser.getByteFrequencyData(spectre);
      const moy = (a, b) => { let s = 0; for (let i = a; i < b; i++) s += spectre[i]; return s / (b - a) / 255; };
      const grave = moy(1, 6), medium = moy(6, 22), aigu = moy(22, 48);
      window.__audioNiveaux = { grave, medium, aigu, total: (grave + medium + aigu) / 3 };
    }
    requestAnimationFrame(niveaux);

    // ================= DÉMARRAGE =================
    const scene = document.querySelector('a-scene');
    const cible = $('cible');
    let demarre = false;

    $('go').addEventListener('click', async () => {
      if (demarre) return;
      demarre = true;
      $('go').classList.add('charge');
      $('go').innerHTML = 'CHARGEMENT<span class="petit">quelques secondes</span>';
      // la musique démarre sur le clic : les navigateurs l'exigent
      brancherAudio();
      track.play().catch(() => {});

      try {
        const sys = scene.systems['mindar-image-system'];
        if (!scene.hasLoaded) await new Promise(r => scene.addEventListener('loaded', r, { once: true }));
        await ciblePrete;
        await sys.start();
        // la caméra tourne : on peut enfin quitter l'accueil
        $('home').classList.add('gone');
        $('mute').classList.add('on'); $('back').classList.add('on'); $('hint').classList.add('on');
      } catch (e) {
        console.error(e);
        erreur("Autorise l'accès à la caméra dans ton navigateur, puis recharge la page.");
      }
    });

    $('mute').addEventListener('click', () => {
      track.muted = !track.muted;
      $('mute').textContent = track.muted ? '🔇 Son coupé' : '🔊 Son';
    });

    $('back').addEventListener('click', () => {
      try { scene.systems['mindar-image-system'].stop(); } catch (e) {}
      track.pause(); track.currentTime = 0;
      demarre = false;
      $('go').classList.remove('charge');
      $('go').innerHTML = 'LANCER<span class="petit">CAMÉRA + SON</span>';
      $('home').classList.remove('gone');
      $('mute').classList.remove('on'); $('back').classList.remove('on'); $('hint').classList.remove('on');
    });

    cible.addEventListener('targetFound', () => $('hint').classList.add('cache'));
    cible.addEventListener('targetLost', () => $('hint').classList.remove('cache'));

    if (!window.isSecureContext) {
      erreur("Ouvre cette page en <b>https://</b> : les navigateurs bloquent la caméra autrement.");
    }
  </script>
</body>
</html>
