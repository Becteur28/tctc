    AFRAME.registerComponent('suivi-lisse', {
      schema: {
        target:    { type: 'selector' },
        lostDelay: { default: 700 }
      },
      init() {
        this.tPos = new THREE.Vector3(); this.tQuat = new THREE.Quaternion(); this.tScale = new THREE.Vector3();
        this.hasPose = false; this.lastSeen = -1e9; this.appear = 0;
        this.content = this.el.querySelector('[data-contenu]');
        this.el.object3D.visible = false;
      },
      tick(t, dtMs) {
        const dt = Math.min(dtMs || 16, 100) / 1000;
        const o = this.el.object3D;
        const m = this.data.target.object3D;

        if (m.visible) {
          m.updateMatrixWorld(true);
          m.matrixWorld.decompose(this.tPos, this.tQuat, this.tScale);
          if (!this.hasPose || t - this.lastSeen > this.data.lostDelay) {
            o.position.copy(this.tPos); o.quaternion.copy(this.tQuat); o.scale.copy(this.tScale);
            this.hasPose = true;
          } else {
            const dist = Math.max(this.tPos.length(), 0.5);
            const vPos = o.position.distanceTo(this.tPos) / dist / dt;
            const vRot = o.quaternion.angleTo(this.tQuat) / dt;
            const tauPos = THREE.MathUtils.mapLinear(THREE.MathUtils.clamp(vPos, 0.3, 3), 0.3, 3, 0.20, 0.03);
            const tauRot = THREE.MathUtils.mapLinear(THREE.MathUtils.clamp(vRot, 1.5, 12), 1.5, 12, 0.35, 0.05);
            o.position.lerp(this.tPos, 1 - Math.exp(-dt / tauPos));
            o.quaternion.slerp(this.tQuat, 1 - Math.exp(-dt / tauRot));
            o.scale.lerp(this.tScale, 1 - Math.exp(-dt / tauPos));
          }
          this.lastSeen = t;
        }

        if (TOUJOURS_A_L_ENDROIT && this.hasPose && this.content) this.keepUpright(o);

        const visible = this.hasPose && (t - this.lastSeen < this.data.lostDelay);
        this.appear += ((visible ? 1 : 0) - this.appear) * (1 - Math.exp(-dt / 0.08));
        if (this.appear < 0.01 && !visible) this.appear = 0;
        o.visible = this.appear > 0;
        if (this.content) this.content.object3D.scale.setScalar(Math.max(this.appear, 0.0001) * TAILLE);

        if (visible !== this.wasVisible) {
          this.wasVisible = visible;
          this.el.emit(visible ? 'contenu-visible' : 'contenu-cache');
        }
      },

      keepUpright(o) {
        const cam = this.el.sceneEl.camera;
        if (!cam) return;
        if (this.quarter === undefined) this.quarter = 0;
        o.updateMatrixWorld(true);
        const center = new THREE.Vector3().setFromMatrixPosition(o.matrixWorld).project(cam);
        const score = (k) => {
          const a = k * Math.PI / 2;
          const top = new THREE.Vector3(-Math.sin(a) * 0.5, 0, -Math.cos(a) * 0.5).applyMatrix4(o.matrixWorld).project(cam);
          const dx = top.x - center.x, dy = top.y - center.y;
          return dy / (Math.hypot(dx, dy) || 1);
        };
        let best = this.quarter, bestScore = score(this.quarter);
        const current = bestScore;
        for (let k = 0; k < 4; k++) { const sc = score(k); if (sc > bestScore) { best = k; bestScore = sc; } }
        if (best !== this.quarter && bestScore > current + 0.35) {
          this.quarter = best;
          this.content.object3D.rotation.set(0, best * Math.PI / 2, 0);
        }
      }
    });

        const hh = Hh * Math.min(open, 1.04);
        const y0 = (Hh - hh) / 2;
        const rect = () => { c.beginPath(); c.roundRect(40, y0 + 40, W - 80, hh - 80, 70); };

        // Fond noir aux bords flous
        c.shadowColor = 'rgba(0,0,0,0.95)'; c.shadowBlur = 40;
        rect(); c.fillStyle = 'rgba(4,4,4,0.97)'; c.fill();
        c.shadowBlur = 0;
        // Contour doux
        rect(); c.strokeStyle = 'rgba(255,255,255,0.10)'; c.lineWidth = 2; c.stroke();
        c.clip();

        // Brouillard lumineux (bas) + lueur (haut)
        const fogY = y0 + hh - 60 + Math.sin(now * 0.7) * 20;
        const fg = c.createRadialGradient(W / 2, fogY, 0, W / 2, fogY, 620);
        fg.addColorStop(0, 'rgba(255,255,255,0.20)'); fg.addColorStop(0.5, 'rgba(255,255,255,0.06)'); fg.addColorStop(1, 'rgba(255,255,255,0)');
        c.fillStyle = fg; c.fillRect(0, 0, W, Hh);
        const tg0 = c.createRadialGradient(W * 0.5, y0 - 80, 0, W * 0.5, y0 - 80, 520);
        tg0.addColorStop(0, 'rgba(255,255,255,0.12)'); tg0.addColorStop(1, 'rgba(255,255,255,0)');
        c.fillStyle = tg0; c.fillRect(0, 0, W, Hh);

        const a = (start, dur = 0.45) => Math.min(Math.max((t - start) / dur, 0), 1);
        const pad = 96;

        // En-tête
        c.globalAlpha = a(0.35);
        c.fillStyle = '#8c8c8c';
        c.font = `400 26px ${fTitle}`;
        c.letterSpacing = '12px';
        c.fillText(`${ARTISTE} · NOUVEL ALBUM`, pad, y0 + 150);

        // Titre en relief lumineux
        c.globalAlpha = this.smooth(a(0.45, 0.8));
        c.letterSpacing = '6px';
        let size = 128;
        c.font = `900 ${size}px ${fTitle}`;
        while (c.measureText(ALBUM).width > W - pad * 2 - 30 && size > 60) { size -= 4; c.font = `900 ${size}px ${fTitle}`; }
        const ty = y0 + 190 + size * 0.95;
        this.depthText(c, ALBUM, pad + 8, ty, 0.8 + 0.2 * Math.sin(now * 1.6));
        c.letterSpacing = '0px';

        // Pastille statut
        c.globalAlpha = a(0.6);
        c.font = `600 22px ${fBody}`;
        c.letterSpacing = '5px';
        const tw = c.measureText(STATUT).width;
        const py = ty + 40;
        c.beginPath(); c.roundRect(pad, py, tw + 48, 46, 23);
        c.fillStyle = 'rgba(255,255,255,0.06)'; c.fill();
        c.strokeStyle = 'rgba(255,255,255,0.35)'; c.lineWidth = 2; c.stroke();
        const blink = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(now * 3.5));
        c.shadowColor = 'white'; c.shadowBlur = 14;
        c.fillStyle = `rgba(255,255,255,${blink})`;
        c.beginPath(); c.arc(pad + 23, py + 23, 6, 0, Math.PI * 2); c.fill();
        c.shadowBlur = 0;
        c.fillStyle = '#e6e6e6';
        c.fillText(STATUT, pad + 40, py + 31);
        c.letterSpacing = '0px';

        // Séparateur
        const sepY = py + 118;
        c.globalAlpha = a(0.7);
        c.font = `600 20px ${fBody}`; c.letterSpacing = '7px'; c.fillStyle = '#6c6c6c';
        c.fillText('TRACKLIST', pad, sepY - 18);
        c.textAlign = 'right';
        c.fillText(`${TRACKLIST.length} TITRES`, W - pad, sepY - 18);
        c.textAlign = 'left'; c.letterSpacing = '0px';
        const sepG = c.createLinearGradient(pad, 0, W - pad, 0);
        sepG.addColorStop(0, 'rgba(255,255,255,0)'); sepG.addColorStop(0.5, 'rgba(255,255,255,0.45)'); sepG.addColorStop(1, 'rgba(255,255,255,0)');
        c.fillStyle = sepG; c.fillRect(pad, sepY, W - pad * 2, 2);

        // Lignes
        const listTop = sepY + 24;
        const listBottom = y0 + hh - 90;
        const rowH = Math.min(70, (listBottom - listTop) / Math.max(TRACKLIST.length, 1));
        const active = Math.floor(now / 2.6) % Math.max(TRACKLIST.length, 1);
        const introDone = t > 0.85 + TRACKLIST.length * 0.07;
        TRACKLIST.forEach((tr, i) => {
          const p = this.smooth(a(0.85 + i * 0.07, 0.6));
          if (p <= 0) return;
          const y = listTop + i * rowH;
          const x = pad;
          const isActive = introDone && i === active;
          c.globalAlpha = p;
          // apparition floue → nette
          const blur = (1 - p) * 18;

          if (isActive) {
            const hg = c.createLinearGradient(pad - 30, 0, W - pad + 30, 0);
            hg.addColorStop(0, 'rgba(255,255,255,0.14)'); hg.addColorStop(0.7, 'rgba(255,255,255,0.05)'); hg.addColorStop(1, 'rgba(255,255,255,0)');
            c.fillStyle = hg;
            c.beginPath(); c.roundRect(pad - 30, y + 4, W - pad * 2 + 60, rowH - 8, rowH / 2); c.fill();
          }

          const mid = y + rowH / 2 + 11;
          c.shadowColor = 'rgba(255,255,255,0.9)';
          c.shadowBlur = isActive ? 22 : blur;
          c.font = `400 24px ${fBody}`;
          c.fillStyle = isActive ? '#ffffff' : '#5e5e5e';
          c.fillText(String(i + 1).padStart(2, '0'), x, mid);

          c.font = `600 ${isActive ? 36 : 32}px ${fBody}`;
          c.fillStyle = isActive ? '#ffffff' : `rgba(210,210,210,${0.55 + 0.45 * p})`;
          let title = tr.titre;
          const maxW = W - pad * 2 - 90 - 130;
          while (c.measureText(title).width > maxW && title.length > 2) title = title.slice(0, -2) + '…';
          c.fillText(title, x + 66, mid);

          if (isActive) {
            c.shadowBlur = 16;
            for (let b = 0; b < 5; b++) {
              const hBar = 8 + 26 * Math.abs(Math.sin(now * (4.5 + b * 1.4) + b * 1.7));
              c.fillStyle = '#ffffff';
              c.beginPath(); c.roundRect(W - pad - 62 + b * 13, mid - 4 - hBar / 2, 7, hBar, 4); c.fill();
            }
          } else {
            c.font = `400 24px ${fBody}`;
            c.fillStyle = '#5e5e5e';
            c.textAlign = 'right';
            c.fillText(tr.duree, W - pad, mid);
            c.textAlign = 'left';
          }
          c.shadowBlur = 0;
        });

        // Grain
        c.globalAlpha = 0.07;
        c.globalCompositeOperation = 'overlay';
        c.save();
        c.translate(Math.random() * 256, Math.random() * 256);
        c.fillStyle = this.noisePattern;
        c.fillRect(-256, -256, W + 512, Hh + 512);
        c.restore();
        c.globalCompositeOperation = 'source-over';

        c.restore();
        c.globalAlpha = 1;
        this.panelTex.needsUpdate = true;
      },

      tick(time, dtMs) {
        const dt = Math.min(dtMs || 16, 100) / 1000;
        this.clock += dt;
        if (this.visible) this.t += dt; else this.hiddenFor = (this.hiddenFor || 0) + dt;
        const now = this.clock;

        // Logo : monte depuis le panneau, se déplie en profondeur, flotte et oscille
        const rise = this.ease(this.t / 1.2);
        const g = this.logoGroup;
        g.position.y = this.logoBaseY - 0.5 * (1 - rise) + 0.04 * Math.sin(now * 1.3);
        g.scale.setScalar(Math.max(0.0001, 0.6 + 0.4 * rise));
        g.rotation.y = 0.32 * Math.sin(now * 0.55);
        g.rotation.x = -0.08 + 0.05 * Math.sin(now * 0.8);
        const fade = this.smooth(this.t / 0.8);
        const spread = this.smooth((this.t - 0.3) / 1.0);   // l'épaisseur se déploie
        this.layers.forEach((m, idx) => {
          const i = this.layers.length - idx;
          m.position.z = -0.012 * i * spread;
          m.material.opacity = 0.9 * fade;
        });
        this.front.material.opacity = fade;
        this.bloom.material.opacity = fade * (0.06 + 0.06 * Math.sin(now * 1.6));
        this.glow.material.opacity = fade * (0.32 + 0.12 * Math.sin(now * 1.6));
        this.aura.material.opacity = this.smooth(this.t / 0.6);
        this.aura.scale.setScalar(0.85 + 0.15 * this.ease(this.t / 1.0));

        // Brouillard qui dérive
        for (const s of this.fog) {
          const u = s.userData;
          s.position.set(u.x + 0.25 * Math.sin(now * u.sp + u.ph), u.y + 0.12 * Math.cos(now * u.sp * 0.8 + u.ph), u.z);
          s.material.opacity = u.op * 1.4 * fade * (0.7 + 0.3 * Math.sin(now * 0.5 + u.ph));
        }

        // Poussière
        const arr = this.particles.geometry.attributes.position.array;
        for (let i = 0; i < this.pSpeed.length; i++) {
          arr[i * 3 + 1] += this.pSpeed[i] * dt;
          arr[i * 3] += Math.sin(now + i) * 0.0008;
          if (arr[i * 3 + 1] > 2.3) arr[i * 3 + 1] = -1.4;
        }
        this.particles.geometry.attributes.position.needsUpdate = true;
        this.particles.material.opacity = 0.7 * fade;

        this.redrawAcc += dt;
        if (this.redrawAcc >= 1 / 30) { this.redrawAcc = 0; this.drawPanel(); }
      }
    });

    // --- Scène AR ---
    document.body.insertAdjacentHTML('beforeend', `
      <a-scene embedded vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; alpha: true; colorManagement: true; antialias: true"
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; patternRatio: 0.5; sourceWidth: 1280; sourceHeight: 960; cameraParametersUrl: ${camUrl};">
        <a-marker id="marker" type="pattern" url="${pattUrl}" minConfidence="0.7"></a-marker>

        <a-entity id="follower" suivi-lisse="target: #marker">
          <a-entity id="spinner" data-contenu>
            <!-- repère de l'affiche : couché sur le marqueur -->
            <a-entity rotation="-90 0 0" cocoon-experience></a-entity>
          </a-entity>
        </a-entity>

        <a-entity camera></a-entity>
      </a-scene>`);

    // --- Caméra ---
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      showError("La page doit être ouverte en <b>https://</b> pour accéder à la caméra.");
    }
    window.addEventListener('camera-error', (e) => {
      showError("Autorise l'accès à la caméra dans ton navigateur (icône à gauche de l'adresse), puis recharge la page.");
      console.error(e);
    });
  </script>
</body>
</html>
