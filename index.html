      "255 255 255 255 255 255 255 255 255 220 226 255 255 255 255 255",
      "255 255 255 255 255 255 255 255 239  54 156 255 255 255 255 255",
      "255 255 255 255 255  90 133 208 115 174 224 255 255 255 255 255",
      "255 255 255 255 255  62  75 124 105 128 219 255 255 255 255 255",
      "255 255 255 255 255 220 203 209 242 161 218 255 255 255 255 255",
      "255 255 255 255 255 255 133 140 131 162 200 255 255 255 255 255",
      "255 255 255 255 255 255 101  98 145 167 208 255 255 255 255 255",
      "255 255 255 255 255 255 187  61 220 194 248 255 255 255 255 255",
      "255 255 255 255 255 255 243 222 250 219 255 255 255 255 255 255",
      "255 255 255 255 255 255 152 122 123 208 255 255 255 255 255 255",
      "255 255 255 255 255 255 238 157  80 158 255 255 255 255 255 255",
      "255 255 255 255 255 255 182 107 186 203 132 255 255 255 255 255",
      "255 255 255 255 255 255 245 229 247 169 223 255 255 255 255 255",
      "255 255 255 255 255 255 102  77 135 120 127 254 255 255 255 255",
      "255 255 255 255 255 255 210 238 250 227 255 255 255 255 255 255",
      "255 255 255 255 255 255 255 255 255 243 255 255 255 255 255 255",
      "",
      ""
    ].join("\n");

    // Paramètres caméra ARToolKit (camera_para.dat)
    const CAMERA_PARA_B64 = "AAACgAAAAeBAgwrsW6bUSwAAAAAAAAAAQHQ3KqAAAAAAAAAAAAAAAAAAAAAAAAAAQIL0K3dHyf9AbbNowAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD/wAAAAAAAAAAAAAAAAAAA/uWNa4AAAAL+3lTLAAAAAv17YFWAAAAA/VYLXIAAAAECCe0YgAAAAQIJlMOAAAABAdDcqoAAAAEBts2jAAAAAP+8OmzqkDy4=";
    // ============================================

    const $ = (id) => document.getElementById(id);
    const showError = (msg) => { $('error-msg').innerHTML = msg; $('error').classList.add('show'); };

    const pattUrl = URL.createObjectURL(new Blob([MARKER_PATT], { type: 'text/plain' }));
    const camBytes = Uint8Array.from(atob(CAMERA_PARA_B64), c => c.charCodeAt(0));
    const camUrl = URL.createObjectURL(new Blob([camBytes], { type: 'application/octet-stream' }));

    // --- Élément vidéo (source de la texture) ---
    const video = document.createElement('video');
    video.id = 'arvideo';
    video.loop = true;
    video.muted = true;               // muet = lecture automatique autorisée
    video.playsInline = true;
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    video.crossOrigin = 'anonymous';
    video.preload = 'auto';
    video.style.display = 'none';
    document.body.appendChild(video);

    // --- Suivi lissé : le contenu suit le marqueur en douceur au lieu de trembler ---
    AFRAME.registerComponent('suivi-lisse', {
      schema: {
        target:    { type: 'selector' },
        lostDelay: { default: 700 }    // ms pendant lesquels le contenu reste si le marqueur est perdu un instant
      },
      init() {
        this.tPos = new THREE.Vector3(); this.tQuat = new THREE.Quaternion(); this.tScale = new THREE.Vector3();
        this.hasPose = false; this.lastSeen = -1e9; this.appear = 0;
        this.content = this.el.querySelector('[data-contenu]');
        this.el.object3D.visible = false;
      },
      tick(t, dtMs) {
        const dt = Math.min(dtMs || 16, 100) / 1000;
        const o = this.el.object3D;
        const m = this.data.target.object3D;

        if (m.visible) {
          m.updateMatrixWorld(true);
          m.matrixWorld.decompose(this.tPos, this.tQuat, this.tScale);
          if (!this.hasPose || t - this.lastSeen > this.data.lostDelay) {
            o.position.copy(this.tPos); o.quaternion.copy(this.tQuat); o.scale.copy(this.tScale);
            this.hasPose = true;
          } else {
            // Filtre adaptatif : petits tremblements très lissés, vrais mouvements suivis vite
            const dist = Math.max(this.tPos.length(), 0.5);
            const vPos = o.position.distanceTo(this.tPos) / dist / dt;
            const vRot = o.quaternion.angleTo(this.tQuat) / dt;
            const tauPos = THREE.MathUtils.mapLinear(THREE.MathUtils.clamp(vPos, 0.3, 3), 0.3, 3, 0.20, 0.03);
            const tauRot = THREE.MathUtils.mapLinear(THREE.MathUtils.clamp(vRot, 1.5, 12), 1.5, 12, 0.35, 0.05);
            o.position.lerp(this.tPos, 1 - Math.exp(-dt / tauPos));
            o.quaternion.slerp(this.tQuat, 1 - Math.exp(-dt / tauRot));
            o.scale.lerp(this.tScale, 1 - Math.exp(-dt / tauPos));
          }
          this.lastSeen = t;
        }

        if (TOUJOURS_A_L_ENDROIT && this.hasPose && this.content) this.keepUpright(o);

        // Apparition / disparition douce (sans clignoter)
        const visible = this.hasPose && (t - this.lastSeen < this.data.lostDelay);
        this.appear += ((visible ? 1 : 0) - this.appear) * (1 - Math.exp(-dt / 0.08));
        if (this.appear < 0.01 && !visible) this.appear = 0;
        o.visible = this.appear > 0;
        if (this.content) this.content.object3D.scale.setScalar(Math.max(this.appear, 0.0001));

        if (visible !== this.wasVisible) {
          this.wasVisible = visible;
          this.el.emit(visible ? 'contenu-visible' : 'contenu-cache');
        }
      },

      // Choisit le quart de tour (0/90/180/270°) pour que le haut de la vidéo pointe vers le haut de l'écran
      keepUpright(o) {
        const cam = this.el.sceneEl.camera;
        if (!cam) return;
        if (this.quarter === undefined) this.quarter = 0;
        o.updateMatrixWorld(true);
        const center = new THREE.Vector3().setFromMatrixPosition(o.matrixWorld).project(cam);
        const score = (k) => {
          // haut de la vidéo = -Z local, tourné de k×90° autour de la normale (Y)
          const a = k * Math.PI / 2;
          const top = new THREE.Vector3(-Math.sin(a) * 0.5, 0, -Math.cos(a) * 0.5).applyMatrix4(o.matrixWorld).project(cam);
          const dx = top.x - center.x, dy = top.y - center.y;
          return dy / (Math.hypot(dx, dy) || 1);   // 1 = pointe droit vers le haut de l'écran
        };
        let best = this.quarter, bestScore = score(this.quarter);
        const current = bestScore;
        for (let k = 0; k < 4; k++) { const sc = score(k); if (sc > bestScore) { best = k; bestScore = sc; } }
        if (best !== this.quarter && bestScore > current + 0.35) {   // marge pour éviter de basculer en boucle
          this.quarter = best;
          this.content.object3D.rotation.set(0, best * Math.PI / 2, 0);
        }
      }
    });

    // --- Scène AR ---
    document.body.insertAdjacentHTML('beforeend', `
      <a-scene embedded vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; alpha: true; colorManagement: true; antialias: true"
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; patternRatio: 0.5; sourceWidth: 1280; sourceHeight: 960; cameraParametersUrl: ${camUrl};">
        <a-marker id="marker" type="pattern" url="${pattUrl}" minConfidence="0.7"></a-marker>

        <!-- Conteneur lissé qui suit le marqueur -->
        <a-entity id="follower" suivi-lisse="target: #marker">
          <a-entity id="spinner" data-contenu rotation="0 ${ROTATION_FIXE} 0">
            <a-video id="overlay-plane" src="#arvideo" position="0 0.01 0" rotation="-90 0 0"
              width="${VIDEO_SIZE}" height="${VIDEO_SIZE}"></a-video>
          </a-entity>
        </a-entity>

        <a-entity camera></a-entity>
      </a-scene>`);

    const plane = $('overlay-plane');
    const follower = $('follower');
    const soundBtn = $('sound');
    let markerVisible = false;

    // --- Taille du plan selon le format de la vidéo ---
    video.addEventListener('loadedmetadata', () => {
      const r = video.videoWidth / video.videoHeight || 1;
      plane.setAttribute('width',  r >= 1 ? VIDEO_SIZE : VIDEO_SIZE * r);
      plane.setAttribute('height', r >= 1 ? VIDEO_SIZE / r : VIDEO_SIZE);
      detectAudio();
    });

    // --- Lecture : la vidéo joue seulement quand le marqueur est visible ---
    const play = () => video.play().catch(() => {});
    follower.addEventListener('contenu-visible', () => { markerVisible = true;  play(); });
    follower.addEventListener('contenu-cache',   () => { markerVisible = false; video.pause(); });

    // --- Son (bouton affiché seulement si la vidéo a une piste audio) ---
    function hasAudio() {
      return !!(video.mozHasAudio || (video.webkitAudioDecodedByteCount || 0) > 0 ||
                (video.audioTracks && video.audioTracks.length > 0));
    }
    function detectAudio() {
      soundBtn.style.display = 'none';
      const check = () => { if (hasAudio()) soundBtn.style.display = 'block'; };
      video.addEventListener('playing', () => setTimeout(check, 400), { once: true });
      // décodage bref pour savoir s'il y a du son, même avant détection du marqueur
      video.play().then(() => setTimeout(() => { check(); if (!markerVisible) video.pause(); }, 400)).catch(() => {});
    }
    function updateSoundLabel() { soundBtn.textContent = video.muted ? '🔇 Activer le son' : '🔊 Couper le son'; }
    soundBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      updateSoundLabel();
      if (markerVisible) play();
    });

    // --- Chargement de la vidéo ---
    video.src = DEFAULT_VIDEO;
    updateSoundLabel();
    video.load();

    // --- Caméra ---
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      showError("La page doit être ouverte en <b>https://</b> pour accéder à la caméra.<br>Voir le fichier LISEZ-MOI.md.");
    }
    window.addEventListener('camera-error', (e) => {
      showError("Autorise l'accès à la caméra dans ton navigateur (icône à gauche de l'adresse), puis recharge la page.");
      console.error(e);
    });
  </script>
</body>
</html>
